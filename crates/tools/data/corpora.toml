# Curated list of Aiken codebases by high-expertise authors.
#
# Add an entry per repo. Fields:
#   name:        slug used as directory name when sync-corpus.sh clones
#   url:         git URL (https or ssh)
#   author:      individual or org maintaining the repo
#   tags:        topics; useful for `aiken_corpus_list` filtering
#   description: one-liner
#   notes:       (optional) what to study, what's interesting, gotchas
#
# Sync via `scripts/sync-corpus.sh /path/to/dir`. Then
# `AIKEN_MCP_CORPUS=/path/to/dir/aiken-stdlib:/path/to/dir/midnight-reserve-contracts:...`

[[entries]]
name = "aiken-stdlib"
url = "https://github.com/aiken-lang/stdlib.git"
author = "aiken-lang"
tags = ["stdlib", "primitives"]
description = "Official Aiken standard library."
notes = "Canonical reference for idiomatic Aiken. Read first."

[[entries]]
name = "aiken-prelude"
url = "https://github.com/aiken-lang/prelude.git"
author = "aiken-lang"
tags = ["stdlib", "primitives"]
description = "Aiken prelude (auto-imported)."
notes = "Lower-level than stdlib. Read for built-in types + base ops."

[[entries]]
name = "merkle-patricia-forestry"
url = "https://github.com/aiken-lang/merkle-patricia-forestry.git"
author = "aiken-lang"
tags = ["merkle", "patricia", "trie", "audited", "high-priority"]
description = "Aiken + Node.js libs for Merkle Patricia Tries on Cardano."
notes = "Production-grade Aiken impl of Patricia trie work. HIGH PRIORITY for trie verifier porting."

[[entries]]
name = "aiken-sparse-merkle-tree"
url = "https://github.com/aiken-lang/sparse-merkle-tree.git"
author = "aiken-lang"
tags = ["merkle", "sparse", "validator"]
description = "Sparse Merkle tree library focused on efficient on-chain proofs."
notes = "Reference for ordered-merkle-tree patterns."

[[entries]]
name = "aiken-fuzz"
url = "https://github.com/aiken-lang/fuzz.git"
author = "aiken-lang"
tags = ["testing", "fuzz", "property-testing"]
description = "Fuzzers for property-based testing in Aiken."
notes = "Read for test-writing patterns + Aiken's PBT harness."

[[entries]]
name = "aiken-staking"
url = "https://github.com/aiken-lang/staking.git"
author = "aiken-lang"
tags = ["staking", "delegation", "stake-validator"]
description = "Stateful redelegation by tying delegation credential to spend validator."
notes = "Reference for stake-validator multiplexing pattern."

[[entries]]
name = "midnight-reserve-contracts"
url = "https://github.com/midnightntwrk/midnight-reserve-contracts.git"
author = "Kasey/microproofs"
tags = ["beefy", "mmr", "merkle", "bridge", "audited", "high-priority"]
description = "Cardano-side BEEFY authority tracker for Midnight. TxPipe-audited."
notes = "Reference impl of multi-member Merkle proofs, MMR walks, BEEFY signature verify, two-stage upgradable contracts. Highest-quality bridge primitives in Aiken."

[[entries]]
name = "fortuna"
url = "https://github.com/cardano-miners/fortuna.git"
author = "microproofs"
tags = ["mining", "pow", "validator"]
description = "PoW-style minting validator (TUNA). Cardano onchain randomness source."
notes = "Worth studying for tight exec-budget code paths."

[[entries]]
