[package]
name = "aiken-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server binary for aiken-mcp"

[[bin]]
name = "aiken-mcp"
path = "src/main.rs"

[dependencies]
aiken-mcp-core.workspace = true
aiken-mcp-cli.workspace = true
aiken-mcp-corpus.workspace = true
aiken-mcp-docs.workspace = true
aiken-mcp-lsp.workspace = true
aiken-mcp-symbols.workspace = true
aiken-mcp-blueprint.workspace = true
aiken-mcp-tools.workspace = true

anyhow.workspace = true
async-trait.workspace = true
rmcp = { version = "1.6", features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
